<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>ArtReads - Resetare Parolă</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Lora&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Lora', serif;
            background: #fdfbf7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #2c2c2c;
        }
        .auth-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            width: 380px;
            border: 1px solid #eae5d9;
        }
        h2 {
            font-family: 'Playfair Display', serif;
            text-align: center;
            margin-bottom: 25px;
            color: #3b302a;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #dcd6cd;
            border-radius: 6px;
            box-sizing: border-box;
            background: #faf9f6;
            font-family: inherit;
        }
        button {
            background: #5c4033;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
            font-family: inherit;
        }
        button:hover { background: #432e24; }
        .error { color: #a94442; font-size: 14px; text-align: center; margin-top: 10px; }
        .success { color: #27ae60; font-size: 14px; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

<div class="auth-card">
    <h2>Resetare Parolă 🔑</h2>
    <p style="font-size: 13px; color: #666; text-align: center; margin-bottom: 20px;">Alege o nouă parolă sigură pentru contul tău.</p>

    <input type="password" id="new-password" placeholder="Noua Parolă">
    <input type="password" id="confirm-password" placeholder="Reintrodu noua parolă">

    <button onclick="resetPassword()">Salvează Parola Nouă</button>

    <p class="error" id="msg-error"></p>
    <p class="success" id="msg-success"></p>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    async function resetPassword() {
        const password = document.getElementById('new-password').value;
        const confirmPassword = document.getElementById('confirm-password').value;

        if (!password || !confirmPassword) {
            document.getElementById('msg-error').innerText = "Te rog completează ambele câmpuri.";
            return;
        }

        if (password !== confirmPassword) {
            document.getElementById('msg-error').innerText = "Parolele nu coincid! Te rog verifică din nou.";
            return;
        }

        if (!token) {
            document.getElementById('msg-error').innerText = "Token de resetare invalid sau lipsă.";
            return;
        }

        const response = await fetch('/api/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `token=${encodeURIComponent(token)}&password=${encodeURIComponent(password)}`
        });

        if (response.ok) {
            document.getElementById('msg-success').innerText = "Parola a fost schimbată! Te poți autentifica.";
            document.getElementById('msg-error').innerText = "";
            setTimeout(() => { window.location.href = '/login.html'; }, 3000);
        } else {
            const err = await response.text();
            document.getElementById('msg-error').innerText = err;
            document.getElementById('msg-success').innerText = "";
        }
    }
</script>
</body>
</html>
